name: Cron tick
# Runs the push reminders and the bank inbox check. The app scales to zero,
# so this request wakes it and does the work inside the request.
on:
  schedule:
    # Kyiv days 1, 5, 6 and 16-18, plus the UTC day before each (Kyiv days
    # start 21:00-22:00 UTC the evening before). Other days nothing is due,
    # and each call costs compute hours on the Hobby plan.
    - cron: "7 * 28-31,1,4-6,15-18 * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: cron-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /internal/cron/tick
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_ORIGIN" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_ORIGIN variable and CRON_SECRET secret must be set"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 300 \
            --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "X-Requested-With: cron-tick" \
            "${APP_ORIGIN%/}/internal/cron/tick"

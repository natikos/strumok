name: Cron tick
# Runs the push reminders and the bank inbox check. The app scales to zero,
# so this request wakes it and does the work inside the request.
on:
  schedule:
    # Kyiv days 1, 5, 6 and 16-18. 05:30 and 06:30 UTC are 08:30 Kyiv in
    # summer and winter respectively, so one run lands on or after 08:30
    # whatever the DST regime; the app skips a run before 08:30 and sends
    # each reminder once. Other days nothing is due, and each call costs
    # compute hours on the Hobby plan.
    - cron: "30 5,6 1,5,6,16-18 * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: cron-tick
  cancel-in-progress: false
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /internal/cron/tick
        env:
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_ORIGIN" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_ORIGIN variable and CRON_SECRET secret must be set"
            exit 1
          fi
          curl --fail --silent --show-error --max-time 300 \
            --retry 2 --retry-delay 20 --retry-all-errors \
            -X POST \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "X-Requested-With: cron-tick" \
            "${APP_ORIGIN%/}/internal/cron/tick"

name: Deployment
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&status=success" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::No successful CI run for ${{ github.sha }}. Fix or re-run CI before deploying."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: backend

      - name: Require production migrations applied
        working-directory: backend
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL_READONLY }}
          # Migration files import app settings; these are never connected to.
          DATABASE_URL: postgresql+psycopg://unused@localhost/unused
          ENVIRONMENT: development
          AUTH_SECRET_KEY: preflight-only
          PUSH_VAPID_PUBLIC_KEY: preflight-only
          PUSH_VAPID_PRIVATE_KEY: preflight-only
          PUSH_VAPID_SUBJECT: mailto:ci@example.com
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::Missing secret PROD_DATABASE_URL_READONLY"
            exit 1
          fi
          uv sync
          uv run python scripts/check_migrations.py || {
            echo "::error::Apply the listed migrations to production before deploying."
            exit 1
          }

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install
        working-directory: frontend

      - name: Build frontend
        run: bun run build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""

      - uses: astral-sh/setup-uv@v7
        with:
          working-directory: backend

      - name: Deploy
        run: uv run fastapi deploy
        working-directory: backend
        env:
          FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
          FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

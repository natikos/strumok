name: Push reminders

# Runs outside the web process so it isn't skipped if FastAPI Cloud scales to
# zero, doesn't duplicate across instances, and survives a deploy at the
# scheduled time -- see issue #159. Fires a few times per reminder day
# (day 1 = window opens, day 5 = deadline) in Kyiv morning; the internal
# endpoint is idempotent per (period, variant), so a repeated or overlapping
# run never double-sends.
on:
  schedule:
    - cron: "0 6 1 * *"
    - cron: "0 7 1 * *"
    - cron: "0 9 1 * *"
    - cron: "0 6 5 * *"
    - cron: "0 7 5 * *"
    - cron: "0 9 5 * *"
  workflow_dispatch:
    inputs:
      variant:
        description: "Reminder variant to send"
        required: true
        type: choice
        options: [opening, final]
        default: opening

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Determine variant
        id: variant
        run: |
          if [ -n "${{ inputs.variant }}" ]; then
            echo "value=${{ inputs.variant }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%d)" = "01" ]; then
            echo "value=opening" >> "$GITHUB_OUTPUT"
          else
            echo "value=final" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger reminder send
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" -X POST \
            "${{ secrets.APP_BASE_URL }}/internal/push/send-reminders?variant=${{ steps.variant.outputs.value }}" \
            -H "X-Internal-Secret: ${{ secrets.AUTH_INTERNAL_SECRET }}")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Reminder trigger failed with status $status"
            exit 1
          fi
